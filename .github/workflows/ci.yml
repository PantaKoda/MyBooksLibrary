# Continuous integration: installs Qt and the pdfbookmark SDK (.github/actions/
# setup), then runs scripts/verify.ps1 -- the same single verification entry
# point used for local verification (text checks, build, tests, application
# smoke checks). It then builds and checks the Windows package
# (scripts/package.ps1), as a release does (release.yml).
# The job id `build-and-test` is the required status check; do not rename it
# without telling the repository owner.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    # Visual Studio 2026 (MSVC 14.5x), the toolset the SDK is built with; its
    # C++ API passes standard library types across the DLL boundary.
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Qt and the pdfbookmark SDK (.github/actions/setup)
        uses: ./.github/actions/setup

      - name: Verify (scripts/verify.ps1)
        run: >
          ./scripts/verify.ps1 -Configuration Release
          -QtDir "$env:QT_ROOT_DIR"
          -SdkDir "$env:PDFBOOKMARK_SDK"

      # The release workflow's package and its checks (notices, imports, the
      # app run from a copy outside the repository), so a change that breaks
      # packaging fails its pull request, not a release.
      - name: Package (scripts/package.ps1)
        run: >
          ./scripts/package.ps1 -SkipZip
          -QtDir "$env:QT_ROOT_DIR"
          -SdkDir "$env:PDFBOOKMARK_SDK"
